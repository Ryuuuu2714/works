<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<!-- スマホ対応必須タグ：画面幅に合わせて表示を最適化 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「澱ノ手」について調べてるやつがいる</title>
<style>
  /* ====== PC・ベーススタイル（他スレと共通） ====== */
  body {
    background-color: #EFEFEF;
    color: #000000;
    font-family: "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
    font-size: 16px;
    margin: 20px 40px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  h1 {
    font-size: 18px;
    color: #CC0000;
    border-bottom: 1px solid #CC0000;
    padding-bottom: 5px;
    line-height: 1.3;
  }
  .res { margin-bottom: 2em; animation: fadein 0.8s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .number { color: #000000; }
  .name { color: #008000; font-weight: bold; }
  .date { color: #666666; font-size: 0.9em; }
  .message { margin-top: 0.8em; margin-left: 2em; line-height: 1.5; }
  .typing { color: #999999; font-size: 0.9em; }
  .archived {
    margin-top: 3em;
    padding: 1em;
    border-top: 1px solid #999999;
    color: #666666;
    animation: fadein 2s ease-out;
  }
  .archived a { color: #0000FF; font-weight: bold; }

  /* ====== スマホ用レスポンシブスタイル ====== */
  @media (max-width: 768px) {
    body { margin: 10px 15px; font-size: 14px; }
    h1 { font-size: 16px; }
    .message { margin-left: 1em; }
    .date { display: block; margin-top: 2px; margin-left: 1em; }
  }
</style>
</head>
<body>

  <h1>「澱ノ手」について調べてるやつがいる</h1>

  <div id="thread"></div>
  <div id="typing" class="typing">新着レスを受信中…</div>
  <div id="footer"></div>

<script>
// ============================================================
// エンディングの実況スレ（開いた瞬間の「いまの時刻」で書き込みが増えていく）
// ★ POSTS の文章を書き換えればOK。{P1}〜{P4} はプレイヤー名に置き換わる
// ★ INTERVAL で書き込みの間隔（ミリ秒）を調整できる
// ============================================================
const PLAYERS = ["レイ", "オカノ", "ユキト", "リク"];   // ★ mirror/records.js の CONFIG.players と合わせる
const INTERVAL = [3500, 6000];                          // ★ 次の書き込みまで 3.5〜6秒
const NAME = "名無しにかわりましてNullがお送りします";
const POSTS = [
  { text: "富山で「澱ノ手」嗅ぎ回っとる大学生がおるらしいな" },
  { text: "今日？" },
  { text: "今日。いま。<br>図書館と松川を回って、今は環水公園のあたりやと" },
  { text: "高校の同級生同士なんやって。4人と、案内役が1人" },
  { text: "名前は{P1}とかいうらしい" },
  { text: "あー{P2}ってやつもいるんだ" },
  { text: "{P3}も{P4}も終わりだね" },
  { text: "2004年のときも5人やったな" },
  { text: "案内人おつかれ" },
  { text: "次は誰を連れてくるん？" },
  { text: "お前らこれ遊びで調べないほうが良いぞ", id: "ksh4fa45" },   // 2004年・2006年と同じID
  { text: "もう遅いけど" }
];

const $thread = document.getElementById("thread");
const $typing = document.getElementById("typing");
const $footer = document.getElementById("footer");

function pad(n) { return String(n).padStart(2, "0"); }
function now() {
  const d = new Date();
  return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " +
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function randomId() {
  const c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  for (let i = 0; i < 8; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function fill(text) {
  return text.replace("{P1}", PLAYERS[0]).replace("{P2}", PLAYERS[1]).replace("{P3}", PLAYERS[2]).replace("{P4}", PLAYERS[3]);
}

let i = 0;
function post() {
  const p = POSTS[i];
  const div = document.createElement("div");
  div.className = "res";
  div.innerHTML =
    '<span class="number">' + (i + 1) + '</span> ：<span class="name">' + NAME + '</span>：' +
    '<span class="date">' + now() + " ID:" + (p.id || randomId()) + "</span>" +
    '<div class="message">' + fill(p.text) + "</div>";
  $thread.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  i++;
  if (i < POSTS.length) {
    setTimeout(post, INTERVAL[0] + Math.random() * (INTERVAL[1] - INTERVAL[0]));
  } else {
    setTimeout(function () {
      $typing.remove();
      $footer.innerHTML =
        '<div class="archived">このスレッドは過去ログ倉庫に格納されました。<br><br>' +
        '<a href="015clear.html">ドッキリ大成功</a></div>';
      $footer.scrollIntoView({ behavior: "smooth", block: "end" });
    }, 4000);
  }
}
setTimeout(post, 800);
</script>

</body>
</html>
